<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LifeOS — Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:white;
    background:
        radial-gradient(circle at 20% 20%, #263cff55, transparent 30%),
        radial-gradient(circle at 80% 80%, #00d9ff44, transparent 30%),
        #050816;
}

/* STARS */

.stars{
    position:fixed;
    inset:0;
    pointer-events:none;
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    opacity:.7;
    animation:twinkle 3s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.2}
    to{opacity:1}
}

/* MAIN */

.container{
    width:min(1050px,92%);
    min-height:620px;

    display:grid;
    grid-template-columns:1fr 1fr;

    border:1px solid rgba(255,255,255,.12);
    border-radius:35px;

    overflow:hidden;

    background:rgba(255,255,255,.045);
    backdrop-filter:blur(25px);

    box-shadow:
        0 30px 100px rgba(0,0,0,.55),
        0 0 80px rgba(0,217,255,.08);
}

/* LEFT */

.left{
    padding:60px;

    display:flex;
    flex-direction:column;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            rgba(0,217,255,.08),
            rgba(90,50,255,.08)
        );
}

.logo{
    font-size:28px;
    font-weight:900;
    margin-bottom:70px;
}

.logo span{
    color:#00d9ff;
}

.left h1{
    font-size:55px;
    line-height:1;
    margin-bottom:20px;
}

.gradient{
    background:
        linear-gradient(
            90deg,
            #00d9ff,
            #7c3cff,
            #ff4fd8
        );

    -webkit-background-clip:text;
    color:transparent;
}

.left p{
    color:#8996b4;
    line-height:1.7;
    max-width:420px;
}

.city{
    margin-top:45px;

    display:flex;
    gap:12px;
}

.city-box{
    width:75px;
    height:75px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:28px;

    border-radius:18px;

    background:#ffffff08;
    border:1px solid #ffffff12;

    transition:.3s;
}

.city-box:hover{
    transform:translateY(-8px);
    border-color:#00d9ff66;
    box-shadow:0 10px 30px #00d9ff22;
}

/* RIGHT */

.right{
    padding:60px;

    display:flex;
    flex-direction:column;
    justify-content:center;

    background:rgba(0,0,0,.15);
}

.right h2{
    font-size:35px;
    margin-bottom:8px;
}

.subtitle{
    color:#7886a4;
    margin-bottom:35px;
}

/* FORM */

.input-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#b7c2d8;
    font-size:14px;
}

input{
    width:100%;

    padding:16px;

    border-radius:12px;

    border:1px solid #ffffff14;

    outline:none;

    background:#ffffff08;

    color:white;

    font-size:15px;

    transition:.3s;
}

input:focus{
    border-color:#00d9ff;
    box-shadow:0 0 20px #00d9ff18;
}

input::placeholder{
    color:#64718c;
}

/* OPTIONS */

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin:8px 0 25px;

    color:#7886a4;

    font-size:13px;
}

.options a{
    color:#00d9ff;
    text-decoration:none;
}

/* BUTTON */

.login-btn{
    width:100%;

    padding:16px;

    border:0;

    border-radius:13px;

    color:white;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    background:
        linear-gradient(
            90deg,
            #009dff,
            #7040ff
        );

    box-shadow:
        0 10px 30px #006eff33;

    transition:.3s;
}

.login-btn:hover{
    transform:translateY(-3px);

    box-shadow:
        0 15px 40px #006eff55;
}

/* DIVIDER */

.divider{
    display:flex;
    align-items:center;
    gap:10px;

    margin:25px 0;

    color:#59667f;

    font-size:12px;
}

.divider::before,
.divider::after{
    content:"";
    height:1px;
    flex:1;
    background:#ffffff10;
}

/* GUEST */

.guest{
    width:100%;

    padding:14px;

    border-radius:12px;

    background:#ffffff06;

    border:1px solid #ffffff10;

    color:#b8c4d9;

    cursor:pointer;

    font-weight:bold;

    transition:.3s;
}

.guest:hover{
    background:#ffffff0c;
    border-color:#00d9ff44;
}

.signup{
    text-align:center;

    margin-top:25px;

    color:#65728d;

    font-size:14px;
}

.signup a{
    color:#00d9ff;
    text-decoration:none;
    font-weight:bold;
}

/* MESSAGE */

.message{
    margin-top:18px;

    text-align:center;

    color:#00d9ff;

    font-size:14px;

    min-height:20px;
}

/* MOBILE */

@media(max-width:800px){

    body{
        overflow:auto;
        padding:25px 0;
    }

    .container{
        grid-template-columns:1fr;
    }

    .left{
        padding:40px 30px;
    }

    .left h1{
        font-size:42px;
    }

    .logo{
        margin-bottom:35px;
    }

    .right{
        padding:40px 30px;
    }

}

</style>
</head>

<body>


<!-- STARS -->

<div class="stars">

<span class="star" style="left:8%;top:15%"></span>
<span class="star" style="left:18%;top:70%"></span>
<span class="star" style="left:32%;top:25%"></span>
<span class="star" style="left:47%;top:12%"></span>
<span class="star" style="left:60%;top:75%"></span>
<span class="star" style="left:73%;top:30%"></span>
<span class="star" style="left:86%;top:15%"></span>
<span class="star" style="left:92%;top:65%"></span>
<span class="star" style="left:55%;top:45%"></span>

</div>


<!-- MAIN -->

<div class="container">


<!-- LEFT SIDE -->

<div class="left">

<div class="logo">
Life<span>OS</span> ⚡
</div>

<h1>
Welcome to
<br>
<span class="gradient">
Your Future.
</span>
</h1>

<p>
Your personal digital city is waiting.
Enter LifeOS and manage your goals,
learning, creativity, ideas and future.
</p>


<div class="city">

<div class="city-box">🧠</div>
<div class="city-box">🎯</div>
<div class="city-box">📚</div>
<div class="city-box">🚀</div>

</div>

</div>


<!-- RIGHT SIDE -->

<div class="right">

<h2>Welcome Back</h2>

<p class="subtitle">
Enter your details to enter your city.
</p>


<form id="loginForm">

<div class="input-group">

<label>Email</label>

<input
type="email"
id="email"
placeholder="you@example.com"
required
>

</div>


<div class="input-group">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter your password"
required
>

</div>


<div class="options">

<label>
<input
type="checkbox"
style="width:auto;margin-right:6px;"
>
Remember me
</label>

<a href="#" onclick="forgotPassword()">
Forgot password?
</a>

</div>


<button
class="login-btn"
type="submit">

🚀 Enter LifeOS

</button>

</form>


<div class="message" id="message"></div>


<div class="divider">
OR
</div>


<button
class="guest"
onclick="guestMode()">

👤 Continue as Guest

</button>


<div class="signup">

Don't have an account?
<a href="#" onclick="createAccount()">
Create one
</a>

</div>

</div>

</div>


<script>

/* LOGIN */

document
.getElementById("loginForm")
.addEventListener("submit",function(event){

event.preventDefault();

let email =
document.getElementById("email").value;

let password =
document.getElementById("password").value;

if(email && password){

document.getElementById("message").innerText =
"✨ Login successful! Welcome to LifeOS.";

localStorage.setItem(
"lifeosUser",
email
);

setTimeout(function(){

window.location.href="index.html";

},1200);

}

});


/* GUEST */

function guestMode(){

localStorage.setItem(
"lifeosGuest",
"true"
);

document.getElementById("message").innerText =
"🚀 Entering LifeOS as Guest...";

setTimeout(function(){

window.location.href="index.html";

},1000);

}


/* FORGOT */

function forgotPassword(){

alert(
"Password recovery demo.\n\nConnect a real authentication service later to enable password recovery."
);

}


/* CREATE ACCOUNT */

function createAccount(){

alert(
"Account creation page will be added next."
);

}

</script>

</body>
  </html>
